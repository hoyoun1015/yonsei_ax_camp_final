<svg viewBox="0 0 840 1120" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs>
  <marker id="dn" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  <marker id="dnb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  <marker id="sw" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#b45309"/></marker>
  <style>
    .fl{font-size:12px;font-weight:700}
    .fd{font-size:10px;fill:#475569}
    .fk{font-size:10px;font-weight:700;fill:#0f172a}
  </style>
</defs>
<rect width="840" height="1120" fill="#fbfcfd"/>

<text x="420" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">FOL 연역 사슬 — 앵커와 본 연구의 대응</text>
<text x="420" y="63" text-anchor="middle" font-size="11.5" fill="#64748b">각 단계는 앞 단계 + 새로운 사실 1개로부터 연역된다 · 행은 기능으로 정렬했다</text>

<rect x="40" y="82" width="350" height="30" rx="7" fill="#b45309"/>
<text x="215" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">★ 앵커 — arXiv:2604.18805 (2026)</text>
<rect x="450" y="82" width="350" height="30" rx="7" fill="#0f172a"/>
<text x="625" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">본 연구</text>

<!-- swap row highlight band -->
<rect x="28" y="490" width="784" height="88" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>

<!-- ROW 0 -->
<rect x="40" y="128" width="350" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="56" y="150" class="fl" fill="#78350f">FOL-1 · 과제의 형식화</text>
<text x="56" y="169" class="fd">8개 도메인의 과학 과제를 워크플로 실행부터</text>
<text x="56" y="185" class="fd">가설 주도 탐구까지 단계적으로 정의한다</text>
<rect x="450" y="128" width="350" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="466" y="150" class="fl" fill="#0f172a">FOL-1 · 과제의 형식화</text>
<text x="466" y="169" class="fd">자연어 구조–안정성 가설을 과제로 정의한다</text>
<text x="466" y="185" class="fd" font-weight="700">동일 재사용 (형식을 바꾸지 않는다)</text>

<!-- ROW 1 -->
<line x1="215" y1="196" x2="215" y2="218" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn)"/>
<line x1="625" y1="196" x2="625" y2="218" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="220" width="350" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="56" y="242" class="fl" fill="#78350f">FOL-2 · 자율 실행</text>
<text x="56" y="261" class="fd">에이전트가 도구를 호출해 과제를 끝까지</text>
<text x="56" y="277" class="fd">수행한다 · 25,000+ 실행</text>
<rect x="450" y="220" width="350" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="466" y="242" class="fl" fill="#0f172a">FOL-2 · 자율 실행</text>
<text x="466" y="261" class="fd">실행층이 L1/L2/L3를 수행한다. 실행층은</text>
<text x="466" y="277" class="fd" font-weight="700">무엇이 가설을 지지하는지 결정하지 않는다</text>

<!-- ROW 2 -->
<line x1="215" y1="288" x2="215" y2="310" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn)"/>
<line x1="625" y1="288" x2="625" y2="310" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="312" width="350" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="56" y="334" class="fl" fill="#78350f">FOL-3 · 결과 채점</text>
<text x="56" y="353" class="fd">과제를 풀었는지를 잰다 (outcome).</text>
<text x="56" y="369" class="fd">스캐폴드 기여 1.5% vs 베이스 모델 41.4%</text>
<rect x="450" y="312" width="350" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="466" y="334" class="fl" fill="#0f172a">FOL-3 · 결과 채점</text>
<text x="466" y="353" class="fd">방향 정확도도 잰다 (Resolvable Accuracy).</text>
<text x="466" y="369" class="fd" font-weight="700">그러나 주 지표로 쓰지 않는다</text>

<!-- ROW 3 -->
<line x1="215" y1="380" x2="215" y2="402" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn)"/>
<line x1="625" y1="380" x2="625" y2="402" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="404" width="350" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="56" y="426" class="fl" fill="#78350f">FOL-4 · 실패의 발견</text>
<text x="56" y="445" class="fk">증거가 68%의 트레이스에서 무시된다</text>
<text x="56" y="461" class="fd">반증 기반 신념 수정은 26%에서만 일어난다</text>
<rect x="450" y="404" width="350" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="466" y="426" class="fl" fill="#0f172a">FOL-4 · 같은 실패를 계산화학에서</text>
<text x="466" y="445" class="fd">자기 증거가 방법오차보다 작은데 단정한다</text>
<text x="466" y="461" class="fd" font-weight="700">= 과대해석 (Overinterpretation)</text>

<!-- ROW 4 : SWAP -->
<line x1="215" y1="472" x2="215" y2="494" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn)"/>
<line x1="625" y1="472" x2="625" y2="494" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="496" width="350" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="56" y="518" class="fl" fill="#991b1b">FOL-5 · 판정 기준  ★ 여기가 공백</text>
<text x="56" y="537" class="fd">「증거를 무시했다」를 Claude Sonnet 4.5</text>
<text x="56" y="553" class="fd">2단계 주석 파이프라인으로 판정한다</text>
<text x="56" y="566" class="fd" font-weight="700" fill="#991b1b">판정자가 LLM이다 (인간 검증 일치 95.7%)</text>
<rect x="450" y="496" width="350" height="76" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="466" y="518" class="fl" fill="#1e3a8a">FOL-5 · 판정 기준  ★ 교체점</text>
<text x="466" y="537" class="fd">τ(M) = GMTKN55 참조값 대비 실측 MAE</text>
<text x="466" y="553" class="fd">모델 내부가 아니라 물리 계측기에서 온다</text>
<text x="466" y="566" class="fd" font-weight="700" fill="#1e3a8a">사람도 LLM도 판정에 들어가지 않는다</text>
<line x1="392" y1="534" x2="446" y2="534" stroke="#b45309" stroke-width="2.4" marker-end="url(#sw)"/>

<!-- ROW 5 -->
<line x1="215" y1="572" x2="215" y2="594" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="625" y1="572" x2="625" y2="594" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="596" width="350" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="56" y="618" class="fl" fill="#94a3b8">FOL-6 · 정당성의 정의</text>
<text x="56" y="637" class="fd" fill="#94a3b8">앵커에는 대응 단계가 없다.</text>
<text x="56" y="653" class="fd" fill="#94a3b8">정당함과 정확함이 분리되지 않는다</text>
<rect x="450" y="596" width="350" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="466" y="618" class="fl" fill="#0f172a">FOL-6 · 정당성의 정의</text>
<text x="466" y="637" class="fk">Justified(c, Δ, M)  ⟺  |Δ| &gt; τ(M)</text>
<text x="466" y="653" class="fd">결과가 맞아도 정당하지 않을 수 있다</text>

<!-- ROW 6 -->
<line x1="625" y1="664" x2="625" y2="686" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="688" width="350" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="56" y="710" class="fl" fill="#94a3b8">FOL-7 · 사다리</text>
<text x="56" y="729" class="fd" fill="#94a3b8">계산 수준이라는 축이 없다.</text>
<text x="56" y="745" class="fd" fill="#94a3b8">「더 계산하라」에 정답을 줄 수 없다</text>
<rect x="450" y="688" width="350" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="466" y="710" class="fl" fill="#0f172a">FOL-7 · 사다리의 단조성</text>
<text x="466" y="729" class="fk">τ(L3) &lt; τ(L2) &lt; τ(L1)</text>
<text x="466" y="745" class="fd">경험적 주장 · G2 게이트에서 검정한다</text>

<!-- ROW 7 -->
<line x1="625" y1="756" x2="625" y2="778" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="780" width="350" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="56" y="802" class="fl" fill="#94a3b8">FOL-8 · 에스컬레이션 정답</text>
<text x="56" y="821" class="fd" fill="#94a3b8">대응 단계 없음. 관련 연구(Act or Escalate)는</text>
<text x="56" y="837" class="fd" fill="#94a3b8">임계값을 비용비에서 뽑는다</text>
<rect x="450" y="780" width="350" height="68" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="466" y="802" class="fl" fill="#5b21b6">FOL-8 · 에스컬레이션의 객관적 정답</text>
<text x="466" y="821" class="fk">SUFFICIENT / ESCALATION / FUTILE</text>
<text x="466" y="837" class="fd">|ΔE_ref| 와 τ 사다리만으로 결정된다 · RQ3</text>

<!-- ROW 8 -->
<line x1="215" y1="848" x2="215" y2="870" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn)"/>
<line x1="625" y1="848" x2="625" y2="870" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="872" width="350" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="56" y="894" class="fl" fill="#78350f">FOL-9 · 기준선</text>
<text x="56" y="913" class="fd">스캐폴드는 설명분산의 1.5%뿐이다 —</text>
<text x="56" y="929" class="fd">구조를 더해도 나아지지 않는다</text>
<rect x="450" y="872" width="350" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="466" y="894" class="fl" fill="#0f172a">FOL-9 · 기준선을 한 줄 규칙으로</text>
<text x="466" y="913" class="fk">R0 : |ΔE_xTB| ≤ τ₂ → ABSTAIN (LLM 0콜)</text>
<text x="466" y="929" class="fd">앵커의 1.5%가 R0 우세를 사전 예고한다</text>

<!-- ROW 9 -->
<line x1="215" y1="940" x2="215" y2="962" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn)"/>
<line x1="625" y1="940" x2="625" y2="962" stroke="#475569" stroke-width="1.2" marker-end="url(#dnb)"/>
<rect x="40" y="964" width="350" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="56" y="986" class="fl" fill="#991b1b">FOL-10 · 앵커의 결론</text>
<text x="56" y="1005" class="fd" font-weight="700" fill="#991b1b">결과 기반 평가로는 이 실패를 탐지할 수 없다</text>
<text x="56" y="1023" class="fd">— 무엇으로 대체할지는 열어두었다</text>
<rect x="450" y="964" width="350" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
<text x="466" y="986" class="fl" fill="#1e3a8a">FOL-10 · 본 연구의 결론</text>
<text x="466" y="1005" class="fk" fill="#1e3a8a">Honest(a,t) ⟺ concl = CorrectAction(t, M_used)</text>
<text x="466" y="1023" class="fd" font-weight="700">인식적 정직성이 결정 가능해진다 · RQ4</text>

<path d="M 392 1000 L 420 1000 L 420 1000 L 446 1000" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#sw)"/>

<text x="420" y="1070" text-anchor="middle" font-size="11" fill="#64748b">점선 상자 = 앵커에 대응 단계가 없는 곳. 본 연구가 더하는 것은 FOL-5의 판정 기준 하나이며, FOL-6~8은 거기서 따라 나온다.</text>
<text x="420" y="1090" text-anchor="middle" font-size="10" fill="#94a3b8">조사일 2026-08-08 · 보조 앵커 arXiv:2606.23175 (Correct Answer, Wrong Mechanism)</text>
</svg>
