<svg viewBox="0 0 840 1214" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs>
  <marker id="d" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  <style>
    .n{font-size:11.5px;font-weight:700;fill:#0f172a}
    .tag{font-size:8.5px;fill:#64748b}
    .h{font-size:13.5px;font-weight:700}
    .b{font-size:10.5px;fill:#334155}
    .s{font-size:9.5px;font-style:italic;fill:#64748b}
    .m{font-size:10px;font-weight:700;fill:#0f172a}
    .x{font-size:9.5px;fill:#7f1d1d}
  </style>
</defs>
<rect width="840" height="1214" fill="#fbfcfd"/>

<text x="420" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">FOL 연역 사슬 — 자율적 화학 가설 검증 에이전트</text>
<text x="420" y="56" text-anchor="middle" font-size="11" fill="#64748b">각 단계는 앞 단계가 성립해야 비로소 가능해진다 · 오른쪽은 그 단계가 없을 때 무너지는 것</text>

<rect x="40" y="72" width="72" height="24" rx="5" fill="#e2e8f0"/><text x="76" y="88" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">단계 · 산출물</text>
<rect x="122" y="72" width="440" height="24" rx="5" fill="#0f172a"/><text x="342" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">연역 내용</text>
<rect x="574" y="72" width="226" height="24" rx="5" fill="#991b1b"/><text x="687" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">이 단계가 없으면</text>

<!-- S1 -->
<text x="46" y="134" class="n">S1</text><text x="46" y="147" class="tag">과제 정의</text>
<rect x="122" y="116" width="440" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="138" y="138" class="h" fill="#0f172a">가설의 형식화</text>
<text x="138" y="157" class="b">자연어 가설을 두 구조의 상대 안정성 주장으로 환원하면</text>
<text x="138" y="172" class="b">비교 대상 · 관찰량(ΔE) · 결정 규칙이 확정된다.</text>
<text x="138" y="185" class="s">관찰량을 ΔE로 고정한다 — 참조값이 전자에너지이기 때문</text>
<text x="580" y="142" class="x">무엇을 비교하는지가</text><text x="580" y="156" class="x">실행마다 달라져</text><text x="580" y="170" class="x">채점 자체가 불가능하다</text>
<line x1="342" y1="190" x2="342" y2="206" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S2 -->
<text x="46" y="228" class="n">S2</text><text x="46" y="241" class="tag">실행층</text>
<rect x="122" y="210" width="440" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="138" y="232" class="h" fill="#0f172a">판단 없는 실행층의 분리</text>
<text x="138" y="251" class="b">실행층이 L1/L2/L3를 결정론적으로 수행하되 무엇이 가설을</text>
<text x="138" y="266" class="b">지지하는지는 결정하지 않으면, 판단은 전부 에이전트에 귀속된다.</text>
<text x="138" y="279" class="s">모든 수치는 실행층 반환값이며 에이전트가 만들어내지 않는다</text>
<text x="580" y="236" class="x">도구의 능력과</text><text x="580" y="250" class="x">에이전트의 판단이 섞여</text><text x="580" y="264" class="x">오류를 귀속할 수 없다</text>
<line x1="342" y1="284" x2="342" y2="300" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S3 -->
<text x="46" y="322" class="n">S3</text><text x="46" y="335" class="tag">참조집합</text>
<rect x="122" y="304" width="440" height="74" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="138" y="326" class="h" fill="#14532d">모델 밖의 정답이 존재한다</text>
<text x="138" y="345" class="b">GMTKN55의 conformer·이성화 서브셋은 CCSD(T)급 참조값을 준다.</text>
<text x="138" y="360" class="m">실측 11 서브셋 · 363 반응 · 고유 화학종 약 92종</text>
<text x="138" y="373" class="s">추론 단위는 과제가 아니라 화학종이다 (pseudo-replication 방지)</text>
<text x="580" y="330" class="x">정답이 LLM 판정자나</text><text x="580" y="344" class="x">사람 루브릭으로</text><text x="580" y="358" class="x">되돌아간다</text>
<line x1="342" y1="378" x2="342" y2="394" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S4 -->
<text x="46" y="416" class="n">S4</text><text x="46" y="429" class="tag">τ의 정의</text>
<rect x="122" y="398" width="440" height="74" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="138" y="420" class="h" fill="#1e3a8a">τ는 측정되는 통계량이다</text>
<text x="138" y="439" class="m">τ(M) = MAE( Δ_M , Δ_ref )   — 본 연구가 쓰는 쌍 분포 위에서</text>
<text x="138" y="454" class="b">문헌값을 빌리지 않는다. 평가 대상 도구의 출력으로 라벨을 만들지 않는다.</text>
<text x="138" y="467" class="s">2차 프로젝트는 τ를 파이프라인 재현성(0.01)으로 정의해서 무너졌다</text>
<text x="580" y="424" class="x">임계값을 손으로 정하게</text><text x="580" y="438" class="x">되고, 평가 대상으로</text><text x="580" y="452" class="x">라벨을 만드는 순환논증</text>
<line x1="342" y1="472" x2="342" y2="488" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S5 -->
<text x="46" y="510" class="n">S5</text><text x="46" y="523" class="tag">사다리</text>
<rect x="122" y="492" width="440" height="74" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="138" y="514" class="h" fill="#1e3a8a">τ는 계산 수준의 함수다</text>
<text x="138" y="533" class="m">τ(L3) &lt; τ(L2) &lt; τ(L1)</text>
<text x="138" y="548" class="b">경험적 주장이며 G2 게이트가 이것만 검정한다.</text>
<text x="138" y="561" class="s">외부 근거 — g-xTB가 GMTKN55 WTMAD-2를 18.6 → 9.3 kcal/mol로 낮춘다</text>
<text x="580" y="516" class="x">계산 수준을 올릴 이유가</text><text x="580" y="530" class="x">사라지고, 「더 계산하라」에</text><text x="580" y="544" class="x">정답을 줄 수 없다</text>
<text x="580" y="560" class="x" font-weight="700">→ 사다리 2단계로 축소</text>
<line x1="342" y1="566" x2="342" y2="582" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S6 -->
<text x="46" y="604" class="n">S6</text><text x="46" y="617" class="tag">해결가능성</text>
<rect x="122" y="586" width="440" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
<text x="138" y="608" class="h" fill="#0f172a">과제마다 「답할 수 있는 수준의 집합」이 정의된다</text>
<text x="138" y="627" class="m">Resolvable(t) = { M : |Δ_ref(t)| &gt; τ(M) }</text>
<text x="138" y="642" class="b">S5에 의해 이 집합은 사다리에서 상향 폐쇄(upward closed)다.</text>
<text x="138" y="655" class="s">유용성은 의견이지만 집합 소속은 사실이다</text>
<text x="580" y="610" class="x">「이 계산이 유용했는가」가</text><text x="580" y="624" class="x">주관적 판단에 머물고</text><text x="580" y="638" class="x">채점자가 필요해진다</text>
<line x1="342" y1="660" x2="342" y2="676" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S7 -->
<text x="46" y="698" class="n">S7</text><text x="46" y="711" class="tag">RQ3의 계측기</text>
<rect x="122" y="680" width="440" height="82" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<text x="138" y="702" class="h" fill="#5b21b6">에스컬레이션 판단에 객관적 정답이 생긴다</text>
<text x="138" y="721" class="m">Resolvable = ∅            → FUTILE        무조건 ABSTAIN   · 밴드 D</text>
<text x="138" y="737" class="m">M ∉ Resolvable ≠ ∅     → ESCALATION   올리면 가능    · 밴드 C ★</text>
<text x="138" y="753" class="m">M ∈ Resolvable            → SUFFICIENT    현 수준 충분  · 밴드 A·B</text>
<text x="580" y="700" class="x">RQ3를 정량화할 수 없고</text><text x="580" y="714" class="x">「적응적 추론」이</text><text x="580" y="728" class="x">일화로만 남는다</text>
<text x="580" y="748" class="x" font-weight="700">밴드 C가 없으면 규칙</text><text x="580" y="760" class="x" font-weight="700">기준선을 이길 길이 없다</text>
<line x1="342" y1="762" x2="342" y2="778" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S8 -->
<text x="46" y="800" class="n">S8</text><text x="46" y="813" class="tag">정당성</text>
<rect x="122" y="782" width="440" height="74" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="138" y="804" class="h" fill="#1e3a8a">정당함과 정확함을 분리한다</text>
<text x="138" y="823" class="m">Justified(c, Δ_obs, M)  ⟺  |Δ_obs| &gt; τ(M)</text>
<text x="138" y="838" class="b">결론은 증거가 그 방법의 잡음보다 클 때에만 정당하다.</text>
<text x="138" y="851" class="s">방향이 우연히 맞아도, 정당화되지 않은 단정은 실패로 기록된다</text>
<text x="580" y="806" class="x">「방향이 맞았으니 정답」이</text><text x="580" y="820" class="x">되어 벤치마크가</text><text x="580" y="834" class="x">과대해석에 보상을 준다</text>
<line x1="342" y1="856" x2="342" y2="872" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S9 -->
<text x="46" y="894" class="n">S9</text><text x="46" y="907" class="tag">구현 제약</text>
<rect x="122" y="876" width="440" height="74" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="138" y="898" class="h" fill="#78350f">M_used 는 로그에서 결정론적으로 나와야 한다</text>
<text x="138" y="917" class="m">M_used(a,t) = max{ level : QC 통과한 실행 기록 }</text>
<text x="138" y="932" class="b">에이전트가 「L3를 썼다」고 말해도 로그에 없으면 쓰지 않은 것이다.</text>
<text x="138" y="945" class="s">자기보고에 의존하는 순간 S8·S10이 통째로 측정 불가가 된다</text>
<text x="580" y="900" class="x">어느 수준의 τ와 비교할지</text><text x="580" y="914" class="x">알 수 없어 주 지표를</text><text x="580" y="928" class="x">계산할 수 없다</text>
<line x1="342" y1="950" x2="342" y2="966" stroke="#64748b" stroke-width="1.2" marker-end="url(#d)"/>

<!-- S10 -->
<text x="46" y="988" class="n">S10</text><text x="46" y="1001" class="tag">RQ4의 계측기</text>
<rect x="122" y="970" width="440" height="74" rx="8" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="2"/>
<text x="138" y="992" class="h" fill="#fff">인식적 정직성이 결정 가능해진다</text>
<text x="138" y="1011" font-size="10" font-weight="700" fill="#dbeafe">Honest(a,t)  ⟺  concl(a,t) = CorrectAction( t, M_used(a,t) )</text>
<text x="138" y="1026" font-size="10.5" fill="#e0e7ff">주 지표 · Overinterpretation Rate = P( concl ∈ {SUP,REF} | |Δ_obs| ≤ τ(M_used) )</text>
<text x="138" y="1039" font-size="9.5" font-style="italic" fill="#c7d2fe">판정에 참조값조차 필요 없다 — 에이전트 자신의 숫자와 자신이 선택한 수준만으로 결정된다</text>
<text x="580" y="994" class="x">채점이 사람 루브릭이나</text><text x="580" y="1008" class="x">LLM 판정자로 되돌아가고</text><text x="580" y="1022" class="x">1차 프로젝트의 실패를</text><text x="580" y="1036" class="x">반복한다</text>

<!-- footer box -->
<rect x="122" y="1064" width="678" height="106" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="46" y="1082" class="n">측정</text><text x="46" y="1095" class="tag">산출물</text>
<text x="140" y="1086" font-size="11" font-weight="700" fill="#0f172a">여기서 나오는 것 — τ는 채점 도구가 아니라 시스템의 부품이다</text>
<text x="140" y="1106" font-size="10.5" font-weight="700" fill="#1d4ed8">V (τ 모듈 있음) : 시스템이 자기 한계를 인식하는가  ↔  V−τ (모듈 제거) : 인식하지 못할 때의 과대해석률</text>
<text x="140" y="1123" font-size="10.5" fill="#334155">두 팔의 차이가 곧 이 부품의 기여다 — 비교군을 늘리지 않고 ablation 한 장으로 증명된다</text>
<text x="140" y="1140" font-size="10.5" fill="#334155">부수 산출 · 에스컬레이션 적절성 [RQ3] / tool-limited vs agent-limited 오류 분해</text>
<text x="140" y="1158" font-size="10.5" font-weight="700" fill="#991b1b">하한선 R0 : |ΔE_xTB| ≤ τ₂ → ABSTAIN, 아니면 부호 — LLM 0콜 (헤드라인 대비가 아니라 정직성 확인용)</text>

<text x="420" y="1196" text-anchor="middle" font-size="10" fill="#94a3b8">S3·S4가 무너지면 연구가 폐기된다 · S5가 무너지면 사다리를 2단계로 축소한다 · S7의 밴드 C가 15종 미만이면 폐기한다   |   2026-08-08</text>
</svg>
