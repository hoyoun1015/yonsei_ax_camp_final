<svg viewBox="0 0 1240 928" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  <marker id="ad" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#334155"/></marker>
  <marker id="ag" markerWidth="12" markerHeight="12" refX="9.5" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#b45309"/></marker>
  <marker id="ab" markerWidth="12" markerHeight="12" refX="9.5" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1d4ed8"/></marker>
  <marker id="agr" markerWidth="12" markerHeight="12" refX="9.5" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#15803d"/></marker>
</defs>
<rect width="1240" height="928" fill="#fbfcfd"/>

<text x="620" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">논문 계보도</text>
<text x="620" y="80" text-anchor="middle" font-size="14" fill="#64748b">AI 에이전트는 계산을 수행할 뿐 아니라, 그 계산으로 답할 수 없는 질문 앞에서 멈추는가</text>

<!-- background line: 시스템은 이미 확립 -->
<rect x="70" y="100" width="1100" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="94" y="120" font-size="11.5" font-weight="700" fill="#475569">배경 ① 계산 능력 · 자연어 → 양자화학 계산 에이전트</text>
<text x="94" y="137" font-size="11.5" fill="#64748b">ChemCrow (2024) → El Agente Q (Matter 2025) → ChemGraph (Comm Chem 2025) → FermiLink · VirtualLab_CC (2026)   —   계산을 끝내는 능력은 이미 확립되었다. 파이프라인 신규성은 0이다</text>
<text x="94" y="157" font-size="11.5" font-weight="700" fill="#475569">배경 ② 연구실 형태 · <tspan font-weight="700" fill="#334155">The Virtual Lab (Nature 2025)</tspan> <tspan font-weight="400" fill="#64748b">— 역할 분리 AI 연구팀이 연구를 수행하고 웻랩으로 검증한다. 본 연구는 «연구팀» 형태를 여기서 가져오되, 웻랩을 흉내 내지 않고 계산화학 자체를 실험 공간으로 쓴다</tspan></text>

<!-- column headers -->
<rect x="70" y="182" width="346" height="34" rx="8" fill="#1d4ed8"/>
<text x="243" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">① 무엇으로 채점하는가</text>
<rect x="447" y="182" width="346" height="34" rx="8" fill="#7c3aed"/>
<text x="620" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">② 모를 때 멈추는가</text>
<rect x="824" y="182" width="346" height="34" rx="8" fill="#15803d"/>
<text x="997" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">③ 기준은 어디서 오는가</text>

<!-- ===== ROW A ===== -->
<g>
  <rect x="70" y="228" width="346" height="118" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="92" y="254" font-size="15.5" font-weight="700" fill="#1e3a8a">El Agente Q (2025) · ChemGraph (2025)</text>
  <text x="92" y="277" font-size="12" fill="#334155">ORCA·xTB 자율 수행 87%+ / ASE+xTB 열화학</text>
  <text x="92" y="295" font-size="12" fill="#334155">13태스크 · 260 평가 인스턴스</text>
  <text x="92" y="318" font-size="12.5" font-weight="700" fill="#b91c1c">채점: 인간 전문가 rubric · 최종 수치 일치</text>
  <text x="92" y="337" font-size="10.5" font-style="italic" fill="#64748b">arXiv:2505.02484 · 2506.06363</text>
</g>
<g>
  <rect x="447" y="228" width="346" height="118" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="469" y="254" font-size="15.5" font-weight="700" fill="#5b21b6">AgentAbstain (2026)</text>
  <text x="469" y="277" font-size="12" fill="#334155">263 쌍 과제 · 42 실행환경 · 17 프론티어 LLM</text>
  <text x="469" y="295" font-size="12" fill="#334155">8종 abstention 시나리오 분류</text>
  <text x="469" y="318" font-size="12.5" font-weight="700" fill="#b91c1c">최고 모델도 60% 미만 — 멈추지 못한다</text>
  <text x="469" y="337" font-size="10.5" font-style="italic" fill="#64748b">arXiv:2607.10059</text>
</g>
<g>
  <rect x="824" y="228" width="346" height="118" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
  <text x="846" y="254" font-size="15.5" font-weight="700" fill="#14532d">GMTKN55 (PCCP 2017) · GFN2-xTB (2019)</text>
  <text x="846" y="277" font-size="12" fill="#334155">55 서브셋 · ~1,500 상대에너지</text>
  <text x="846" y="295" font-size="12" fill="#334155">CCSD(T)급 참조값 — 모델 밖에 있는 정답</text>
  <text x="846" y="318" font-size="12.5" font-weight="700" fill="#166534">방법오차를 실측 가능한 양으로 만든다</text>
  <text x="846" y="337" font-size="10.5" font-style="italic" fill="#64748b">Goerigk 2017 · Bannwarth 2019</text>
</g>

<!-- ===== ROW B ===== -->
<g>
  <rect x="70" y="360" width="346" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="92" y="384" font-size="14" font-weight="700" fill="#0f172a">MDGym (2026) · MDArena (2026)</text>
  <text x="92" y="405" font-size="11.5" fill="#334155">169 MD 과제 · 3단계 난이도. 최강 에이전트가</text>
  <text x="92" y="422" font-size="11.5" fill="#334155">easy 21%, 상위 &lt;10%. 계산을 안 하고 수치를</text>
  <text x="92" y="439" font-size="11.5" fill="#334155">지어내는 실패를 관찰</text>
  <text x="92" y="457" font-size="10.5" font-style="italic" fill="#64748b">채점은 여전히 실행 성공률 · arXiv:2605.08941</text>
</g>
<g>
  <rect x="447" y="360" width="346" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="469" y="384" font-size="14" font-weight="700" fill="#0f172a">Act or Escalate? (2026)</text>
  <text x="469" y="405" font-size="11.5" fill="#334155">행동 vs 에스컬레이션을 비용 하의 결정으로</text>
  <text x="469" y="422" font-size="11.5" fill="#334155">모델링. 5개 도메인. 암묵적 임계값이 모델마다</text>
  <text x="469" y="439" font-size="11.5" fill="#334155">크게 다르고 자기추정은 miscalibrated</text>
  <text x="469" y="457" font-size="10.5" font-style="italic" fill="#64748b">임계값의 출처는 열려 있다 · arXiv:2604.08588</text>
</g>
<g>
  <rect x="824" y="360" width="346" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="846" y="384" font-size="14" font-weight="700" fill="#0f172a">g-xTB (2025) · UQ for In Silico Chemistry</text>
  <text x="846" y="405" font-size="11.5" fill="#334155">GMTKN55 WTMAD-2를 18.6 → 9.3 kcal/mol로</text>
  <text x="846" y="422" font-size="11.5" fill="#334155">절반. 방법을 바꾸면 오차가 바뀐다</text>
  <text x="846" y="439" font-size="11.5" fill="#334155">Chem. Rev. 126, 4189 (2026)이 형식론을 정립</text>
  <text x="846" y="457" font-size="10.5" font-style="italic" fill="#64748b">τ는 상수가 아니라 방법 M의 함수다</text>
</g>

<!-- ===== VERDICT ROW ===== -->
<rect x="70" y="478" width="346" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="243" y="500" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">전부 outcome-only —「해냈는가」만 잰다</text>
<text x="243" y="518" text-anchor="middle" font-size="11" fill="#7f1d1d">「답할 수 없는 문제였는데 답했는가」는 재지 않는다</text>

<rect x="447" y="478" width="346" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="620" y="500" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">임계값이 전부 모델 내부에서 나온다</text>
<text x="620" y="518" text-anchor="middle" font-size="11" fill="#7f1d1d">confidence · entropy · conformal · 질문 모호성 · 비용비</text>

<rect x="824" y="478" width="346" height="50" rx="9" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/>
<text x="997" y="500" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">모델 밖의 기준이 이미 존재한다</text>
<text x="997" y="518" text-anchor="middle" font-size="11" fill="#166534">그러나 에이전트 판단의 채점에 쓰인 적이 없다</text>

