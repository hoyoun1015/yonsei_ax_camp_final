<g>
  <rect x="200" y="584" width="840" height="122" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="4"/>
  <rect x="558" y="574" width="124" height="26" rx="13" fill="#b45309"/>
  <text x="620" y="592" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">★ 앵커 논문</text>
  <text x="228" y="626" font-size="17" font-weight="700" fill="#78350f">AI scientists produce results without reasoning scientifically (2026)</text>
  <text x="228" y="650" font-size="12" fill="#334155">8개 도메인(Corral) · 25,000+ 에이전트 실행 · 베이스 모델이 설명분산 41.4%, 스캐폴드는 1.5%</text>
  <text x="228" y="670" font-size="12.5" font-weight="700" fill="#b91c1c">증거가 68%의 트레이스에서 무시된다 · 반증 기반 신념 수정은 26%뿐</text>
  <text x="228" y="690" font-size="12.5" font-weight="700" fill="#78350f">결론:「결과 기반 평가로는 탐지할 수 없다」 — 그러나 그 판정을 Claude Sonnet 4.5 주석으로 한다</text>
  <text x="1012" y="700" text-anchor="end" font-size="10.5" font-style="italic" fill="#64748b">arXiv:2604.18805 · 같은 명제: Correct Answer Wrong Mechanism (2606.23175)</text>
</g>

