<line x1="620" y1="706" x2="620" y2="742" stroke="#b45309" stroke-width="3" marker-end="url(#ag)"/>
<text x="644" y="728" font-size="11.5" font-weight="700" fill="#b45309">공백을 메운다</text>

<!-- ===== OURS ===== -->
<g>
  <rect x="200" y="748" width="840" height="126" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
  <text x="228" y="782" font-size="17" font-weight="700" fill="#1e3a8a">본 연구 · 분자 시뮬레이션을 통한 자율적 화학 가설 검증 AI 연구 에이전트</text>
  <text x="228" y="806" font-size="12" fill="#334155">자연어 가설 → 계산 설계·실행 → SUPPORTED / REFUTED / ABSTAIN. 만드는 것은 시스템이고, τ는 그 시스템의 부품이다.</text>
  <text x="228" y="830" font-size="12.5" font-weight="700" fill="#1d4ed8">τ 모듈 — 에이전트가 자기 방법의 오차를 알고, |Δ자기증거| ≤ τ(M_used) 이면 결론을 유보한다  [RQ4]</text>
  <text x="228" y="850" font-size="12.5" font-weight="700" fill="#1d4ed8">사다리 — τ가 수준의 함수이므로 SUFFICIENT / ESCALATION / FUTILE 이 기계적으로 결정된다  [RQ3]</text>
  <text x="228" y="868" font-size="11" font-style="italic" fill="#475569">τ는 모델 내부가 아니라 물리 계측기의 벤치마크 오차에서 나온다 · 이 부품이 값을 하는지는 ablation(−τ)으로 보인다</text>
</g>

